[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poolbench"
version = "0.1.0"
description = "PoolBench: A Benchmark for Evaluating Pooling Strategies in LLM Representations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["nlp", "representation-learning", "pooling", "benchmarks", "mechanistic-interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Creative Commons Attribution License (CC-BY)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=3.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "spacy>=3.7.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
sae = ["sae-lens>=3.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
all = ["poolbench[sae,dev]"]

[project.urls]
Homepage      = "https://github.com/poolbench-anon/poolbench"
Repository    = "https://github.com/poolbench-anon/poolbench"
"Bug Tracker" = "https://github.com/poolbench-anon/poolbench/issues"
Paper         = "https://arxiv.org/abs/XXXX.XXXXX"

[tool.hatch.build.targets.wheel]
packages = ["poolbench", "poolbench.data", "poolbench.construction", "poolbench.strategies", "poolbench.evaluation"]

# ── Ruff linting ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py310"
extend-exclude = ["docs/", "data/", "results/"]

[tool.ruff.lint]
select  = ["E", "F", "W", "I"]
ignore  = ["E501"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
